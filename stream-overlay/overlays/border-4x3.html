
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>4:3 Game Border – darkshoxx</title>
<link rel="stylesheet" href="/css/tokens.css">
<style>
  /* 1920x1080 Canvas */
  html, body {
    width: 1920px;
    height: 1080px;
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
  }

  /* 1080x810 Frame centered within the 1440px zone */
  .game-frame {
    position: absolute;
    left: 180px;
    top: 0;
    width: 1080px;
    height: 810px;
    box-sizing: border-box;
    
    border-left: 2px solid var(--cyan);
    border-right: 2px solid var(--cyan);
    border-bottom: 2px solid var(--purple);
    border-top: 2px solid var(--purple);
    box-shadow: var(--shadow-frame);
  }
</style>
</head>
<body>
  <div class="game-frame"></div>
  <script src="/js/ws-client.js"></script>
</body>
</html>
