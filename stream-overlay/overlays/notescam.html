<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Notescam – darkshoxx</title>
<link rel="stylesheet" href="/css/tokens.css">
<style>
  html, body { width:100vw; height:100vh; background:transparent; overflow:hidden; }

  /*
    OBS setup:
      1. Add your notescam Video Capture Device as a source
      2. Add THIS page as a Browser Source at 1920×1080, above the camera source
      3. The server controls visibility — bind Stream Deck to POST /toggle/notescam
  */

  #notescam-frame {
    position: absolute;

    /* Default position — overridden at runtime by layout.js */
    bottom: 0;
    left: 0;
    width: 400px;
    height: 300px;

    box-sizing: border-box;
    border-left:   2px solid var(--cyan);
    border-right:  2px solid var(--cyan);
    border-bottom: 2px solid var(--purple);
    border-top:    2px solid var(--purple);
    box-shadow:
       6px  6px 15px rgba(124, 58, 237, 0.2),
      -6px  6px 15px rgba(124, 58, 237, 0.2),
      inset 0px -2px 10px rgba(0, 245, 255, 0.1);

    opacity: 0;
    pointer-events: none;
  }

  /* Label badge */
  .frame-label {
    position: absolute;
    top: -1px; left: 12px;
    font-family: var(--font-display);
    font-size: 9px;
    font-weight: 700;
    letter-spacing: .15em;
    text-transform: uppercase;
    color: var(--purple);
    background: var(--void);
    padding: 0 6px;
    transform: translateY(-50%);
  }

  /* Corner accents */
  .corner {
    position: absolute;
    width: 10px; height: 10px;
    border-color: var(--cyan);
    border-style: solid;
  }
  .corner.tl { top: -1px;    left: -1px;    border-width: 2px 0 0 2px; }
  .corner.tr { top: -1px;    right: -1px;   border-width: 2px 2px 0 0; }
  .corner.bl { bottom: -1px; left: -1px;    border-width: 0 0 2px 2px; }
  .corner.br { bottom: -1px; right: -1px;   border-width: 0 2px 2px 0; }
</style>
</head>
<body>
<div id="notescam-frame">
  <div class="frame-label">Notescam</div>
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>
</div>

<script src="/js/ws-client.js"></script>
<script src="/js/layout.js"></script>
<script>
  const frame = document.getElementById('notescam-frame');
  LAYOUT.register({ notescam: frame });
</script>
</body>
</html>
