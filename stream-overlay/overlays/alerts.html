<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Alerts – darkshoxx</title>
<link rel="stylesheet" href="/css/tokens.css">
<style>
  html, body { width:100vw; height:100vh; background:transparent; overflow:hidden; }

  /* ── Video player: centered, unscaled ── */
  #video-player {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: none;
    z-index: 10;
    /* no width/height forced — plays at native resolution as requested */
  }
  #video-player.active { display: block; }

  /* ── Alert container: bottom-center ── */
  #alert-root {
    position: fixed;
    bottom: 60px;
    left: 50%;
    transform: translateX(-50%);
    width: 560px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    pointer-events: none;
  }

  /* ── Base alert card ── */
  .alert-card {
    width: 100%;
    background: linear-gradient(135deg, rgba(20,23,32,.97) 0%, rgba(30,34,53,.97) 100%);
    border-radius: var(--r-lg);
    padding: var(--sp-4) var(--sp-6);
    display: flex;
    align-items: center;
    gap: var(--sp-4);
    position: relative;
    overflow: hidden;

    /* entrance / exit handled via JS class toggling */
    animation: cardIn 0.5s var(--ease-out-expo) both;
  }
  .alert-card.exiting {
    animation: cardOut 0.4s var(--ease-out-expo) both;
  }

  @keyframes cardIn {
    0%   { opacity:0; transform: translateY(30px) scale(.92); }
    100% { opacity:1; transform: translateY(0)   scale(1); }
  }
  @keyframes cardOut {
    0%   { opacity:1; transform: translateY(0)   scale(1); }
    100% { opacity:0; transform: translateY(-20px) scale(.95); }
  }

  /* Animated shine sweep */
  .alert-card::before {
    content: '';
    position: absolute; top:0; left:-60%;
    width: 50%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.06), transparent);
    animation: shine 0.7s 0.3s ease-out both;
  }
  @keyframes shine {
    0%   { left: -60%; }
    100% { left: 160%; }
  }

  /* Left accent bar (color changes per alert type) */
  .alert-card .accent-bar {
    position: absolute; left: 0; top: 0; bottom: 0;
    width: 4px;
    border-radius: var(--r-lg) 0 0 var(--r-lg);
  }

  /* ── Icon badge ── */
  .alert-icon {
    flex-shrink: 0;
    width: 52px; height: 52px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
    position: relative;
  }
  .alert-icon::after {
    content: '';
    position: absolute; inset: -3px;
    border-radius: 50%;
    border: 2px solid currentColor;
    animation: iconRing 0.6s 0.2s var(--ease-spring) both;
    opacity: 0.6;
  }
  @keyframes iconRing {
    0%   { transform: scale(0.5); opacity: 0; }
    100% { transform: scale(1);   opacity: 0.6; }
  }

  /* ── Text block ── */
  .alert-text { flex: 1; }
  .alert-label {
    font-family: var(--font-display);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .18em;
    text-transform: uppercase;
    opacity: 0.7;
    margin-bottom: 2px;
  }
  .alert-title {
    font-family: var(--font-display);
    font-size: 20px;
    font-weight: 900;
    line-height: 1.2;
  }
  .alert-sub {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  /* ── Progress bar (auto-dismiss timer) ── */
  .alert-timer {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 2px;
    border-radius: 0 0 var(--r-lg) var(--r-lg);
    transform-origin: left;
    animation: timerDrain var(--alert-duration, 5s) linear both;
  }
  @keyframes timerDrain {
    0%   { transform: scaleX(1); }
    100% { transform: scaleX(0); }
  }

  /* ══ Type-specific themes ══════════════════════════════ */

  /* Follow */
  .alert-follow .accent-bar  { background: var(--cyan); }
  .alert-follow .alert-icon  { background: rgba(0,245,255,.12); color: var(--cyan); }
  .alert-follow .alert-title { color: var(--cyan); text-shadow: var(--glow-cyan); }
  .alert-follow .alert-timer { background: var(--cyan); }

  /* Sub */
  .alert-sub-event .accent-bar  { background: var(--purple); }
  .alert-sub-event .alert-icon  { background: rgba(124,58,237,.15); color: var(--purple); }
  .alert-sub-event .alert-title { color: #c084fc; text-shadow: var(--glow-purple); }
  .alert-sub-event .alert-timer { background: var(--purple); }

  /* Raid */
  .alert-raid .accent-bar  { background: var(--amber); }
  .alert-raid .alert-icon  { background: rgba(245,158,11,.12); color: var(--amber); }
  .alert-raid .alert-title { color: var(--amber); text-shadow: var(--glow-amber); }
  .alert-raid .alert-timer { background: var(--amber); }

  /* Pokemon */
  .alert-pokemon .accent-bar  { background: #facc15; }
  .alert-pokemon .alert-icon  { background: rgba(250,204,21,.10); color: #facc15; }
  .alert-pokemon .alert-title { color: #facc15; }
  .alert-pokemon .alert-timer { background: #facc15; }
  .poke-sprite { width:42px; height:42px; image-rendering: pixelated; }

  /* Spin */
  .alert-spin .accent-bar  { background: #34d399; }
  .alert-spin .alert-icon  { background: rgba(52,211,153,.12); color: #34d399; }
  .alert-spin .alert-title { color: #34d399; }
  .alert-spin .alert-timer { background: #34d399; }
  .spin-emoji { display:inline-block; animation: spinIcon 0.5s linear infinite; }
  @keyframes spinIcon { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<video id="video-player" autoplay></video>
<div id="alert-root"></div>

<script src="/js/chromakey.js"></script>
<script src="/js/ws-client.js"></script>
<script>
console.log('[HTML LOG] Alerts overlay script loaded and initializing...');
const root = document.getElementById('alert-root');
const DURATION = 6000; // ms visible

// ── Alert queue (prevents stack-up) ──────────────────────
const queue = [];
let showing = false;

function enqueue(fn) {
  console.log('[HTML LOG] Queueing alert task. Current queue length prior:', queue.length);
  queue.push(fn);
  if (!showing) {
    console.log('[HTML LOG] Queue worker is idle. Processing queue immediately...');
    processQueue();
  } else {
    console.log('[HTML LOG] Queue worker is currently showing an alert. Item queued.');
  }
}

function processQueue() {
  if (!queue.length) { 
    console.log('[HTML LOG] Queue emptied. Setting showing = false.');
    showing = false; 
    return; 
  }
  showing = true;
  const fn = queue.shift();
  console.log('[HTML LOG] Processing next queued alert item. Remaining in queue:', queue.length);
  fn(() => {
    console.log('[HTML LOG] Alert display completed. Scheduling next item check in 300ms...');
    setTimeout(processQueue, 300);
  });
}

// ── Build & show a card ───────────────────────────────────
function showAlert({ type, iconHtml, label, title, sub, duration = DURATION }) {
  console.log(`[HTML LOG] Showing card: type=${type}, title="${title}", duration=${duration}ms`);
  return new Promise(resolve => {
    const card = document.createElement('div');
    card.className = `alert-card alert-${type}`;
    card.style.setProperty('--alert-duration', `${duration}ms`);
    card.innerHTML = `
      <div class="accent-bar"></div>
      <div class="alert-icon">${iconHtml}</div>
      <div class="alert-text">
        <div class="alert-label">${label}</div>
        <div class="alert-title">${title}</div>
        ${sub ? `<div class="alert-sub">${sub}</div>` : ''}
      </div>
      <div class="alert-timer"></div>
    `;
    root.appendChild(card);
    console.log('[HTML LOG] Appended alert card to DOM.');

    // Auto-dismiss
    const dismissTimer = setTimeout(() => {
      console.log(`[HTML LOG] Alert duration (${duration}ms) expired. Auto-dismissing: "${title}"`);
      dismiss(card, resolve);
    }, duration);

    card.addEventListener('click', () => {
      console.log(`[HTML LOG] Alert card clicked manually: "${title}". Clearing timer and dismissing.`);
      clearTimeout(dismissTimer); 
      dismiss(card, resolve); 
    });
  });
}

function dismiss(card, cb) {
  console.log('[HTML LOG] Dismissing alert card element...');
  card.classList.add('exiting');
  card.addEventListener('animationend', () => { 
    console.log('[HTML LOG] Exit animation complete. Removing card element from DOM.');
    card.remove(); 
    cb?.(); 
  }, { once: true });
}

// ── Alert type handlers ───────────────────────────────────
function alertFollow(detail) {
  console.log('[HTML LOG] alertFollow triggered with detail:', detail);
  enqueue(done => showAlert({
    type: 'follow',
    iconHtml: '♡',
    label: 'New Follower',
    title: detail.user,
    sub: 'just followed the channel!',
  }).then(done));
}

function alertSub(detail) {
  console.log('[HTML LOG] alertSub triggered with detail:', detail);
  const resub = detail.months > 1;
  enqueue(done => showAlert({
    type: 'sub-event',
    iconHtml: '★',
    label: resub ? `${detail.months}-Month Resub` : 'New Subscriber',
    title: detail.user,
    sub: resub
      ? `Back for ${detail.months} months — legend!`
      : 'just subscribed to the channel!',
    duration: 7000,
  }).then(done));
}

function alertRaid(detail) {
  console.log('[HTML LOG] alertRaid triggered with detail:', detail);
  enqueue(done => showAlert({
    type: 'raid',
    iconHtml: '⚔',
    label: 'Incoming Raid',
    title: detail.user,
    sub: `raiding with ${detail.viewers ?? '?'} viewers!`,
    duration: 8000,
  }).then(done));
}

function alertPokemon(detail) {
  console.log('[HTML LOG] alertPokemon triggered with detail:', detail);
  const dex = detail.dex;
  const padded = String(dex).padStart(3, '0');
  const spriteUrl = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${dex}.png`;
  enqueue(done => showAlert({
    type: 'pokemon',
    iconHtml: `<img class="poke-sprite" src="${spriteUrl}" alt="Pokémon #${padded}">`,
    label: 'Pokémon Challenge',
    title: `#${padded}`,
    sub: 'Who\'s that Pokémon?',
    duration: 10000,
  }).then(done));
}

function alertSpin(detail) {
  console.log('[HTML LOG] alertSpin triggered with detail:', detail);
  const user = detail.user || 'Someone';
  enqueue(done => showAlert({
    type: 'spin',
    iconHtml: '<span class="spin-emoji">🎡</span>',
    label: 'Wheel Spin',
    title: user,
    sub: 'successfully redeemed SPIN!',
  }).then(done));
}

// ── Wire up WebSocket events ──────────────────────────────
window.addEventListener('overlay:follow',  e => { console.log('[WS EVENT LOG] Event: overlay:follow'); alertFollow(e.detail); });
window.addEventListener('overlay:sub',     e => { console.log('[WS EVENT LOG] Event: overlay:sub'); alertSub(e.detail); });
window.addEventListener('overlay:raid',    e => { console.log('[WS EVENT LOG] Event: overlay:raid'); alertRaid(e.detail); });
window.addEventListener('overlay:pokemon', e => { console.log('[WS EVENT LOG] Event: overlay:pokemon'); alertPokemon(e.detail); });
window.addEventListener('overlay:spin',    e => { console.log('[WS EVENT LOG] Event: overlay:spin'); alertSpin(e.detail); });
window.addEventListener('overlay:bingo_alarm', () => {
  console.log('[WS EVENT LOG] Event: overlay:bingo_alarm');
  const src = '/assets/videos/bingo.mp4';
  clearTimeout(videoHideTimer);
  ck.stop(); // no chroma key needed for bingo video
  videoEl.src = src;
  videoEl.classList.add('active');
  videoEl.play().then(() => {
    console.log('[VIDEO LOG] Playing bingo alarm video successfully.');
  }).catch(err => {
    console.error('[VIDEO ERROR LOG] Failed playing bingo alarm video:', err);
  });
  // auto-hide when the video ends naturally
});

// ── Video player with chroma key ─────────────────────────
const videoEl = document.getElementById('video-player');
let videoHideTimer = null;

// Chroma key colour per video category (matched by src path prefix)
const CHROMA_KEYS = [
  { match: '/assets/videos/OOT/',     key: ChromaKey.BLACK },
  { match: '/assets/videos/Loom/',    key: ChromaKey.BLACK },
  // Green #22b24d
  { match: '/assets/videos/Myst/',    key: { r: 34, g: 178, b: 77, threshold:80 } },
  // Blue #3f47c9 (hex translates closer to 63, 71, 201, but the threshold will cover the 1-value difference)
  { match: '/assets/videos/Shivers/', key: { r: 63, g: 72, b: 202, threshold: 80 } },
];

const ck = ChromaKey(videoEl, ChromaKey.BLACK);
ck.start();
console.log('[CHROMAKEY LOG] ChromaKey instance created and loop started.');

function getChromaKey(src) {
  const match = CHROMA_KEYS.find(c => src.includes(c.match));
  console.log(`[CHROMAKEY LOG] Matching key for src="${src}":`, match ? match.key : 'None (Disabled)');
  return match ? match.key : null; // null = no chroma key needed
}

function stopVideo() {
  console.log('[VIDEO LOG] Stopping video and resetting state.');
  videoEl.classList.remove('active');
  videoEl.pause();
  videoEl.removeAttribute('src');
}

window.addEventListener('overlay:video', e => {
  console.log('[WS EVENT LOG] Event: overlay:video received detail:', e.detail);
  const { src, duration = 30 } = e.detail;
  clearTimeout(videoHideTimer);

  const keyColor = getChromaKey(src);
  if (keyColor) {
      console.log('[CHROMAKEY LOG] Setting key color filter:', keyColor);
      ck.setKey(keyColor);
  } else {
      console.log('[CHROMAKEY LOG] Disabling key color filter (threshold: -1)');
      ck.setKey({ threshold: -1 }); // Disables keying
  }
  ck.start(); // Always run the canvas

  console.log(`[VIDEO LOG] Setting video.src = "${src}" (Duration timeout: ${duration}s)`);
  videoEl.src = src;
  videoEl.classList.add('active');
  videoEl.play().then(() => {
    console.log('[VIDEO LOG] Video playback initiated successfully.');
  }).catch(err => {
    console.error('[VIDEO ERROR LOG] Video play() failed:', err);
  });
  videoHideTimer = setTimeout(() => {
    console.log(`[VIDEO LOG] Video duration timer (${duration}s) elapsed. Stopping video.`);
    stopVideo();
  }, duration * 1000);
});

videoEl.addEventListener('ended', () => {
  console.log('[VIDEO LOG] Video playback trigger event: "ended" fired.');
  clearTimeout(videoHideTimer);
  stopVideo();
});

videoEl.addEventListener('error', (err) => {
  console.error('[VIDEO ERROR LOG] Video element error encountered:', err, videoEl.error);
});
</script>
</body>
</html>
