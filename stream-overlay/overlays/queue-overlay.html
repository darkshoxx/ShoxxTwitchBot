<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Queue – darkshoxx</title>
<link rel="stylesheet" href="/css/tokens.css">
<style>
  html, body {
    width: 400px;
    background: transparent;
    overflow: hidden;
  }

  /* ── Container ── */
  #queue-root {
    padding: 6px 0 10px;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  /* ── Header ── */
  .q-header {
    font-family: var(--font-display);
    font-size: 9px;
    font-weight: 700;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--text-muted);
    padding: 0 12px 7px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 2px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .q-header-dots {
    display: flex; gap: 4px;
  }
  .q-header-dot {
    width: 6px; height: 6px; border-radius: 50%;
  }
  .dot-weightless { background: #00f5ff; box-shadow: 0 0 4px #00f5ff; }
  .dot-weighted   { background: #c084fc; box-shadow: 0 0 4px #c084fc; }
  .dot-usual      { background: #f59e0b; box-shadow: 0 0 4px #f59e0b; }

  /* ── Entry card ── */
  .q-entry {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    background: rgba(20,23,32,.80);
    border-left: 3px solid var(--entry-color, var(--border));
    border-radius: 0 var(--r-sm) var(--r-sm) 0;
    backdrop-filter: blur(6px);
    position: relative;
    overflow: hidden;
    animation: entryIn 0.35s var(--ease-out-expo) both;
  }
  @keyframes entryIn {
    from { opacity:0; transform: translateX(-10px); }
    to   { opacity:1; transform: translateX(0); }
  }

  /* Subtle top shimmer matching entry colour */
  .q-entry::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg,
      transparent,
      var(--entry-color, transparent),
      transparent);
    opacity: 0.5;
  }

  /* Position badge: 1, 2, 3 */
  .q-pos {
    flex-shrink: 0;
    width: 20px; height: 20px;
    border-radius: 50%;
    border: 1px solid var(--entry-color, var(--border));
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display);
    font-size: 10px;
    font-weight: 900;
    color: var(--entry-color, var(--text-muted));
    opacity: 0.85;
  }

  .q-body { flex: 1; min-width: 0; }

  .q-type {
    font-family: var(--font-display);
    font-size: 8px;
    font-weight: 700;
    letter-spacing: .15em;
    text-transform: uppercase;
    color: var(--entry-color, var(--text-muted));
    opacity: 0.7;
    margin-bottom: 2px;
  }

  .q-label {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.3;
  }

  /* First entry slightly more prominent */
  .q-entry:first-of-type .q-label {
    font-size: 13px;
    color: var(--entry-color, var(--text));
  }
  .q-entry:first-of-type {
    background: rgba(20,23,32,.92);
  }

  /* Empty state */
  .q-empty {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-muted);
    text-align: center;
    padding: 16px 12px;
    letter-spacing: .05em;
  }

  /* ── Closed badge ── */
  .q-closed {
    font-family: var(--font-display);
    font-size: 8px;
    font-weight: 700;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--danger);
    border: 1px solid var(--danger);
    border-radius: 2px;
    padding: 1px 5px;
    opacity: 0.7;
  }
</style>
</head>
<body>
<div id="queue-root">
  <div class="q-header">
    <span>Up Next</span>
    <div style="display:flex;align-items:center;gap:8px;">
      <div class="q-header-dots">
        <div class="q-header-dot dot-weightless" title="Submission"></div>
        <div class="q-header-dot dot-weighted"   title="Weighted submission"></div>
        <div class="q-header-dot dot-usual"      title="Usual demo"></div>
      </div>
      <span class="q-closed" id="closed-badge" style="display:none">Closed</span>
    </div>
  </div>
  <div id="entries"></div>
</div>

<script>
const POLL_MS    = 3000;
const MAX_SHOW   = 3;

const COLORS = {
  weightless: '#00f5ff',
  weighted:   '#c084fc',
  usual:      '#f59e0b',
};

function entryColor(e) {
  if (e.type === 'usual')       return COLORS.usual;
  if (e.weight)                 return COLORS.weighted;
  return COLORS.weightless;
}

function entryTypeLabel(e) {
  if (e.type === 'usual')  return 'Demo';
  if (e.weight)            return 'Submission (queued)';
  return 'Submission';
}

function entryLabel(e) {
  if (e.type === 'usual') return e.game;
  return e.game ? `${e.user} — ${e.game}` : e.user;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function render(entries, isOpen) {
  const container = document.getElementById('entries');
  document.getElementById('closed-badge').style.display = isOpen ? 'none' : 'inline';

  if (!entries.length) {
    container.innerHTML = '<div class="q-empty">Queue is empty</div>';
    return;
  }

  const slice = entries.slice(0, MAX_SHOW);
  container.innerHTML = slice.map((e, i) => {
    const color = entryColor(e);
    return `
      <div class="q-entry" style="--entry-color:${color}">
        <div class="q-pos">${i + 1}</div>
        <div class="q-body">
          <div class="q-type">${entryTypeLabel(e)}</div>
          <div class="q-label">${escHtml(entryLabel(e))}</div>
        </div>
      </div>`;
  }).join('');
}

async function poll() {
  try {
    const [qRes, openRes] = await Promise.all([
      fetch('/queue/state'),
      fetch('/layout'),        // reuse layout endpoint; add queue_open there
    ]);
    const entries  = await qRes.json();
    const layout   = await openRes.json();
    render(entries, layout.queue_open ?? true);
  } catch (_) {
    // server not reachable — keep last render
  }
}

poll();
setInterval(poll, POLL_MS);
</script>
</body>
</html>
