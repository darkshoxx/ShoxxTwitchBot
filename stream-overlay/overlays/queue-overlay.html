<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Queue – darkshoxx</title>
<link rel="stylesheet" href="/css/tokens.css">
<style>
  html, body { width:400px; background:transparent; overflow:hidden; }

  #queue-root { padding:6px 0 10px; display:flex; flex-direction:column; gap:5px; }

  .q-header {
    font-family:var(--font-display); font-size:9px; font-weight:700;
    letter-spacing:.22em; text-transform:uppercase; color:var(--text-muted);
    padding:0 12px 7px; border-bottom:1px solid var(--border); margin-bottom:2px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .q-dots { display:flex; gap:4px; align-items:center; }
  .q-dot  { width:6px; height:6px; border-radius:50%; }
  .dot-wl { background:#00f5ff; box-shadow:0 0 4px #00f5ff; }
  .dot-wt { background:#c084fc; box-shadow:0 0 4px #c084fc; }
  .dot-us { background:#f59e0b; box-shadow:0 0 4px #f59e0b; }
  .q-closed {
    font-family:var(--font-display); font-size:8px; font-weight:700;
    letter-spacing:.12em; text-transform:uppercase; color:var(--danger);
    border:1px solid var(--danger); border-radius:2px; padding:1px 5px; opacity:.7;
  }

  .q-entry {
    display:flex; align-items:center; gap:10px;
    padding:8px 12px;
    background:rgba(20,23,32,.80);
    border-left:3px solid var(--ec,var(--border));
    border-radius:0 var(--r-sm) var(--r-sm) 0;
    backdrop-filter:blur(6px);
    position:relative; overflow:hidden;
    animation:eIn .35s var(--ease-out-expo) both;
  }
  .q-entry::before {
    content:''; position:absolute; top:0; left:0; right:0; height:1px;
    background:linear-gradient(90deg,transparent,var(--ec,transparent),transparent);
    opacity:.5;
  }
  @keyframes eIn { from{opacity:0;transform:translateX(-10px)} to{opacity:1;transform:translateX(0)} }
  .q-entry:first-of-type { background:rgba(20,23,32,.92); }

  .q-pos {
    flex-shrink:0; width:20px; height:20px; border-radius:50%;
    border:1px solid var(--ec,var(--border));
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-size:10px; font-weight:900;
    color:var(--ec,var(--text-muted)); opacity:.85;
  }
  .q-body { flex:1; min-width:0; }
  .q-type {
    font-family:var(--font-display); font-size:8px; font-weight:700;
    letter-spacing:.15em; text-transform:uppercase;
    color:var(--ec,var(--text-muted)); opacity:.7; margin-bottom:2px;
  }
  .q-label {
    font-family:var(--font-mono); font-size:12px; color:var(--text);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:1.3;
  }
  .q-entry:first-of-type .q-label { font-size:13px; color:var(--ec,var(--text)); }
  .q-empty {
    font-family:var(--font-mono); font-size:11px; color:var(--text-muted);
    text-align:center; padding:16px 12px; letter-spacing:.05em;
  }
</style>
</head>
<body>
<div id="queue-root">
  <div class="q-header">
    <span>Up Next</span>
    <div class="q-dots">
      <div class="q-dot dot-wl" title="Submission"></div>
      <div class="q-dot dot-wt" title="Weighted submission"></div>
      <div class="q-dot dot-us" title="Usual demo"></div>
      <span class="q-closed" id="closed-badge" style="display:none">Closed</span>
    </div>
  </div>
  <div id="entries"></div>
</div>
<script>
const MAX_SHOW = 3;
const COLORS = { weightless:'#00f5ff', weighted:'#c084fc', usual:'#f59e0b' };

// Keep track of previous state to avoid unnecessary re-renders
let lastRenderKey = '';

function entryColor(e) {
  if (e.type==='usual') return COLORS.usual;
  return e.weight ? COLORS.weighted : COLORS.weightless;
}
function entryTypeLabel(e) {
  if (e.type==='usual') return 'Demo';
  return e.weight ? 'Submission (queued)' : 'Submission';
}
function entryLabel(e) {
  if (e.type==='usual') return e.game;
  return e.game ? `${e.user} — ${e.game}` : e.user;
}
function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function render(entries, isOpen) {
  // Create a unique fingerprint key representing the current queue state
  const visibleEntries = entries.slice(0, MAX_SHOW);
  const currentRenderKey = JSON.stringify({ isOpen, visibleEntries });

  // If nothing has changed since the last poll, do nothing (prevents re-triggering animations)
  if (currentRenderKey === lastRenderKey) {
    return;
  }
  lastRenderKey = currentRenderKey;

  document.getElementById('closed-badge').style.display = isOpen ? 'none' : 'inline';
  const container = document.getElementById('entries');
  if (!entries.length) { 
    container.innerHTML = '<div class="q-empty">Queue is empty</div>'; 
    return; 
  }
  
  container.innerHTML = visibleEntries.map((e,i) => {
    const c = entryColor(e);
    return `<div class="q-entry" style="--ec:${c}">
      <div class="q-pos">${i+1}</div>
      <div class="q-body">
        <div class="q-type">${entryTypeLabel(e)}</div>
        <div class="q-label">${esc(entryLabel(e))}</div>
      </div></div>`;
  }).join('');
}

async function poll() {
  try {
    const [qRes, lRes] = await Promise.all([fetch('/queue/state'), fetch('/layout')]);
    render(await qRes.json(), (await lRes.json()).queue_open ?? true);
  } catch(_) {}
}

poll();
setInterval(poll, 3000);
</script>
</body>
</html>
