<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>16:9 Game Border – darkshoxx</title>
<link rel="stylesheet" href="/css/tokens.css">
<style>
  /* 1920x1080 Canvas */
  html, body {
    width: 1920px;
    height: 1080px;
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
  }

  /* 1440x810 Frame flush left */
  .game-frame {
    position: absolute;
    left: 0;
    top: 0;
    width: 1440px;
    height: 810px;
    box-sizing: border-box;
    
    border-right: 2px solid var(--cyan);
    border-bottom: 2px solid var(--purple);
    border-left: 2px solid var(--cyan);
    border-top: 2px solid var(--purple);
    box-shadow: var(--shadow-frame-edge);
  }
</style>
</head>
<body>
  <div class="game-frame"></div>
</body>
</html>
