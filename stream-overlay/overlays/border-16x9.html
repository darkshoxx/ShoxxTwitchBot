<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>16:9 Game Border – darkshoxx</title>
<style>
  /* 1920x1080 Canvas */
  html, body {
    width: 1920px;
    height: 1080px;
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
  }

  /* 1440x810 Frame flush left */
  .game-frame {
    position: absolute;
    left: 0;
    top: 0;
    width: 1440px;
    height: 810px;
    box-sizing: border-box;
    
    /* Styling to match your tokens */
    border-right: 2px solid #00f5ff;
    border-bottom: 2px solid #7c3aed;
    border-left: 2px solid #00f5ff;
    border-top: 2px solid #7c3aed;
    box-shadow: 6px 6px 15px rgba(124, 58, 237, 0.2), inset -2px -2px 10px rgba(0, 245, 255, 0.1);
  }
</style>
</head>
<body>
  <div class="game-frame"></div>
</body>
</html>
