<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HUD – darkshoxx</title>
<link rel="stylesheet" href="/css/tokens.css">
<style>
  html, body { width:100vw; height:100vh; background:transparent; overflow:hidden; }

  /* ── Top-right cluster ── */
  #hud-root {
    position: fixed;
    top: 20px; right: 20px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 10px;
    font-family: var(--font-mono);
  }

  /* ── Generic HUD widget ── */
  .hud-widget {
    background: rgba(14,17,26,.80);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    padding: 8px 14px;
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 180px;
    position: relative;
    overflow: hidden;
  }
  .hud-widget::before {
    content: '';
    position: absolute; top:0; left:0; right:0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--cyan), transparent);
    opacity: 0.4;
  }

  .hud-icon { font-size: 16px; flex-shrink: 0; }

  .hud-col { display: flex; flex-direction: column; align-items: flex-end; }
  .hud-label {
    font-size: 9px;
    letter-spacing: .15em;
    text-transform: uppercase;
    color: var(--text-muted);
    line-height: 1;
    margin-bottom: 3px;
  }
  .hud-value {
    font-size: 16px;
    font-weight: 700;
    color: var(--cyan);
    line-height: 1;
  }
  .hud-value.amber { color: var(--amber); }
  .hud-value.purple { color: #c084fc; }
  .hud-value.green  { color: #34d399; }

  /* ── Stream timer ── */
  #stream-time .hud-value { letter-spacing: .05em; font-variant-numeric: tabular-nums; }

  /* ── Song widget wider ── */
  #now-playing { min-width: 240px; }
  #song-title {
    font-size: 12px;
    color: var(--text);
    max-width: 160px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #song-game  { font-size: 9px; color: var(--text-muted); letter-spacing:.08em; }

  /* Spinning note icon */
  .note-spin { display:inline-block; animation: noteSpin 3s linear infinite; }
  @keyframes noteSpin {
    0%,100% { transform: rotate(-10deg); }
    50%      { transform: rotate(10deg);  }
  }

  /* ── Cooldown bar ── */
  #cd-bar-bg {
    position: absolute; bottom:0; left:0; right:0;
    height: 2px; background: var(--border);
  }
  #cd-bar {
    height: 100%;
    background: var(--purple);
    transition: width .5s linear;
    box-shadow: var(--glow-purple);
  }
</style>
</head>
<body>
<div id="hud-root">

  <!-- Stream timer -->
  <div class="hud-widget" id="stream-time">
    <div class="hud-icon">🕐</div>
    <div class="hud-col">
      <div class="hud-label">Stream Time</div>
      <div class="hud-value" id="timer-display">00:00:00</div>
    </div>
  </div>

  <!-- Spin cooldown tracker -->
  <div class="hud-widget" id="spin-widget">
    <div class="hud-icon">🎡</div>
    <div class="hud-col">
      <div class="hud-label">Last Spin</div>
      <div class="hud-value purple" id="spin-ago">—</div>
    </div>
    <div id="cd-bar-bg"><div id="cd-bar" style="width:0%"></div></div>
  </div>

  <!-- Now playing -->
  <div class="hud-widget" id="now-playing">
    <div class="hud-icon"><span class="note-spin">♪</span></div>
    <div class="hud-col">
      <div class="hud-label">Now Playing</div>
      <div id="song-title">Waiting for music...</div>
      <div id="song-game"></div>
    </div>
  </div>

</div>

<script src="/js/ws-client.js"></script>
<script>
// ── Stream timer ──────────────────────────────────────────
const startTime = Date.now();
const timerEl = document.getElementById('timer-display');

function formatTime(ms) {
  const s = Math.floor(ms / 1000);
  const h = String(Math.floor(s / 3600)).padStart(2, '0');
  const m = String(Math.floor((s % 3600) / 60)).padStart(2, '0');
  const sec = String(s % 60).padStart(2, '0');
  return `${h}:${m}:${sec}`;
}
setInterval(() => { timerEl.textContent = formatTime(Date.now() - startTime); }, 1000);

// ── Spin cooldown ─────────────────────────────────────────
const SPIN_CD = 60; // seconds, matches bot
let lastSpinTime = null;
const spinAgoEl = document.getElementById('spin-ago');
const cdBar     = document.getElementById('cd-bar');

window.addEventListener('overlay:spin', () => {
  lastSpinTime = Date.now();
});

setInterval(() => {
  if (!lastSpinTime) return;
  const elapsed = (Date.now() - lastSpinTime) / 1000;
  const remaining = Math.max(0, SPIN_CD - elapsed);
  const pct = ((SPIN_CD - remaining) / SPIN_CD * 100).toFixed(1);
  cdBar.style.width = pct + '%';
  if (remaining > 0) {
    spinAgoEl.textContent = `${Math.ceil(remaining)}s CD`;
    spinAgoEl.style.color = 'var(--amber)';
  } else {
    spinAgoEl.textContent = 'READY';
    spinAgoEl.style.color = 'var(--green, #34d399)';
  }
}, 500);

// ── Now playing (pushed from bot via song event) ──────────
window.addEventListener('overlay:song', e => {
  const { title, game } = e.detail;
  document.getElementById('song-title').textContent = title || '—';
  document.getElementById('song-game').textContent  = game  || '';
});
</script>
</body>
</html>
