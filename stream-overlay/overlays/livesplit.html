<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LiveSplit – darkshoxx</title>
<link rel="stylesheet" href="/css/tokens.css">
<style>
  html, body { width:100vw; height:100vh; background:transparent; overflow:hidden; }

  /*
    OBS setup:
      1. Add your LiveSplit window capture (or Game Capture) as a source
      2. Add THIS page as a Browser Source at 1920×1080, above LiveSplit source
      3. Bind Stream Deck to POST /toggle/livesplit

    LiveSplit HTTP server:
      In LiveSplit: Edit Layout → Layout Settings → enable "LiveSplit Server"
      Default port: 16834  (we poll it to read current timer dimensions)
      If you don't use the HTTP server, the frame just uses a fixed width
      and you size it manually via the FALLBACK_* constants below.
  */

  #livesplit-frame {
    position: absolute;

    /* Default — overridden by layout.js and aspect-ratio polling */
    top: 20px;
    right: 360px;
    width: 200px;
    /* height is set dynamically based on aspect ratio */

    box-sizing: border-box;
    border-left:   2px solid var(--cyan);
    border-right:  2px solid var(--cyan);
    border-bottom: 2px solid var(--purple);
    border-top:    2px solid var(--purple);
    box-shadow:
       6px  6px 15px rgba(124, 58, 237, 0.2),
      -6px  6px 15px rgba(124, 58, 237, 0.2),
      inset 0px -2px 10px rgba(0, 245, 255, 0.1);

    opacity: 0;
    pointer-events: none;

    /* Height transitions smoothly when splits change */
    transition: height 0.5s cubic-bezier(0.16,1,0.3,1),
                opacity 0.3s ease;
  }

  .frame-label {
    position: absolute;
    top: -1px; left: 12px;
    font-family: var(--font-display);
    font-size: 9px;
    font-weight: 700;
    letter-spacing: .15em;
    text-transform: uppercase;
    color: var(--purple);
    background: var(--void);
    padding: 0 6px;
    transform: translateY(-50%);
  }

  /* Timer readout inside the frame (pulled from LiveSplit server) */
  #ls-time {
    position: absolute;
    bottom: 6px; right: 10px;
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--cyan);
    opacity: 0.7;
    letter-spacing: .05em;
  }

  .corner {
    position: absolute;
    width: 10px; height: 10px;
    border-color: var(--cyan);
    border-style: solid;
  }
  .corner.tl { top: -1px;    left: -1px;    border-width: 2px 0 0 2px; }
  .corner.tr { top: -1px;    right: -1px;   border-width: 2px 2px 0 0; }
  .corner.bl { bottom: -1px; left: -1px;    border-width: 0 0 2px 2px; }
  .corner.br { bottom: -1px; right: -1px;   border-width: 0 2px 2px 0; }
</style>
</head>
<body>
<div id="livesplit-frame">
  <div class="frame-label">LiveSplit</div>
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>
  <div id="ls-time">—</div>
</div>

<script src="/js/ws-client.js"></script>
<script src="/js/layout.js"></script>
<script>
const frame  = document.getElementById('livesplit-frame');
const lsTime = document.getElementById('ls-time');

LAYOUT.register({ livesplit: frame });

// ── LiveSplit HTTP server polling ─────────────────────────
// LiveSplit Server component must be active in LiveSplit layout.
// It exposes a plain TCP socket, not HTTP — so we use the community
// livesplit-server wrapper or read via a small proxy.
//
// SIMPLEST APPROACH: poll OBS WebSocket for the LiveSplit source dimensions.
// If you'd rather hard-code, set MANUAL_ASPECT_RATIO below.
//
// The frame width is set by layout.js. We compute height from aspect ratio.

const MANUAL_ASPECT_RATIO = null; // e.g. 1/4 for ultra-tall. null = auto-detect.
const LIVESPLIT_PORT = 16834;     // LiveSplit Server default port

let currentAspect = 1 / 3; // sensible default (tall)

function applyAspect(ratio) {
  currentAspect = ratio;
  const w = parseFloat(frame.style.width) || 200;
  frame.style.height = (w / ratio) + 'px';
}

// Re-apply height whenever width changes (layout.js may update width)
const widthObserver = new ResizeObserver(() => {
  applyAspect(currentAspect);
});
widthObserver.observe(frame);

// ── Fetch timer + detect aspect from LiveSplit Server ─────
// LiveSplit Server speaks a simple newline-delimited text protocol over TCP.
// Browsers can't open raw TCP sockets, so we poll via the node server proxy.
// Add GET /livesplit-time to server.js (see notes), or use manual ratio.

async function pollLiveSplit() {
  try {
    const res = await fetch('/livesplit');
    if (!res.ok) return;
    const data = await res.json();

    if (data.time)   lsTime.textContent = data.time;
    if (data.aspect) applyAspect(data.aspect);
  } catch (_) {}
}

if (MANUAL_ASPECT_RATIO) {
  applyAspect(MANUAL_ASPECT_RATIO);
} else {
  // Poll every 2s; LiveSplit layout changes aren't frequent
  pollLiveSplit();
  setInterval(pollLiveSplit, 2000);
}
</script>
</body>
</html>
